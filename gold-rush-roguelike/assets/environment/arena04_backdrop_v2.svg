<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="ash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5b4037"/><stop offset=".5" stop-color="#3b2a29"/><stop offset="1" stop-color="#211c20"/></linearGradient>
 <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#734536"/><stop offset=".45" stop-color="#432d2b"/><stop offset="1" stop-color="#211b20"/></linearGradient>
 <linearGradient id="lava" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f1607"/><stop offset=".18" stop-color="#ff4c0b"/><stop offset=".5" stop-color="#ffd45a"/><stop offset=".72" stop-color="#ff6410"/><stop offset="1" stop-color="#7f1607"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3a0"/><stop offset=".35" stop-color="#ffc62d"/><stop offset="1" stop-color="#9f5a05"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#ecffff"/><stop offset=".25" stop-color="#61f0ff"/><stop offset="1" stop-color="#087385"/></radialGradient>
 <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="heat" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#ash)"/>

