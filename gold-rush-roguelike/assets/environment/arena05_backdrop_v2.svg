<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a352f"/><stop offset=".55" stop-color="#2e2627"/><stop offset="1" stop-color="#17171b"/></linearGradient>
 <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74787a"/><stop offset=".35" stop-color="#3e4649"/><stop offset="1" stop-color="#171c1f"/></linearGradient>
 <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9c5733"/><stop offset="1" stop-color="#42281f"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ad"/><stop offset=".28" stop-color="#ffd343"/><stop offset=".68" stop-color="#c87c08"/><stop offset="1" stop-color="#704006"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#efffff"/><stop offset=".24" stop-color="#7cf5ff"/><stop offset=".56" stop-color="#15b7cf"/><stop offset="1" stop-color="#064f61"/></radialGradient>
 <radialGradient id="heat"><stop stop-color="#fff0a6"/><stop offset=".3" stop-color="#ff8a1c"/><stop offset="1" stop-color="#7f180b"/></radialGradient>
 <filter id="cyanGlow" x="-180%" y="-180%" width="460%" height="460%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="goldGlow" x="-140%" y="-140%" width="380%" height="380%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
