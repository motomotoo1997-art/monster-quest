<g fill="none" stroke="#d98d58" stroke-width="4" opacity=".28">
 <path d="M25 151 Q118 128 209 142 T392 143 T574 149 T758 141 T946 148 T1250 139"/>
 <path d="M48 170 Q135 151 223 161 T407 162 T594 169 T782 159 T977 169 T1235 158"/>
</g>
