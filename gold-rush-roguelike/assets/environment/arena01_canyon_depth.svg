 <path d="M15 107L69 75M28 75L59 47M80 106L27 75" stroke-width="3.5"/>
 <path d="M-12 147H108" stroke-width="8"/>
 <circle cx="48" cy="17" r="12" stroke-width="5"/>
</g>
<!-- distant elevator / refinery center -->
<g transform="translate(515 61)" opacity=".68" stroke="#3d2d24" stroke-width="5" fill="#614536">
 <rect x="0" y="40" width="63" height="84" rx="3"/>
 <path d="M-10 42 L31 6 L74 42Z"/>
 <rect x="78" y="63" width="44" height="61"/>
 <path d="M72 64 L100 40 L128 64Z"/>
 <rect x="25" y="72" width="14" height="52" fill="#2c251f"/>
 <path d="M64 79H82M121 84H150" fill="none"/>
 <path d="M145 44V124M134 56H156" fill="none"/>
</g>
<!-- suspended ore conveyor right -->
<g transform="translate(835 70)" opacity=".69" stroke="#3b2c24" fill="none">
 <path d="M0 70 L230 30" stroke-width="10"/>
 <path d="M10 81 L239 41" stroke-width="4"/>
 <path d="M35 64V116M97 54V108M160 43V99M219 33V90" stroke-width="6"/>
 <path d="M22 116H48M84 108h27M148 99h26M207 90h25" stroke-width="5"/>
 <g fill="#6e4935" stroke-width="3"><circle cx="44" cy="63" r="8"/><circle cx="108" cy="52" r="8"/><circle cx="172" cy="41" r="8"/></g>
</g>
<!-- water tower / telegraph silhouettes -->
<g opacity=".6" stroke="#453126" fill="#604637">
 <ellipse cx="761" cy="98" rx="27" ry="12" stroke-width="5"/><rect x="736" y="98" width="50" height="34" stroke-width="5"/>
 <path d="M744 132l-13 53M779 132l13 53M727 154h68" fill="none" stroke-width="5"/>
 <path d="M1158 61v120M1134 82h49M1158 84l-36 35M1158 84l34 34" fill="none" stroke-width="6"/>
</g>
<!-- floating haze strips blend horizon into combat field -->
<path d="M0 171 Q198 199 377 180 T713 190 T1014 177 T1280 191 L1280 240 Q1040 214 841 229 T470 221 T0 234Z" fill="#f2b968" opacity=".18"/>
<path d="M0 203 Q224 226 432 208 T796 214 T1280 205" fill="none" stroke="#ffd58e" stroke-width="18" opacity=".09"/>
<!-- small cyan tech lamps to echo weapons without dominating -->
<g fill="#64eefa" opacity=".72">
 <circle cx="312" cy="128" r="4"/><circle cx="563" cy="145" r="4"/><circle cx="1004" cy="128" r="4"/>
</g>
</svg>