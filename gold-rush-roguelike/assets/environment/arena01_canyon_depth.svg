<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="skyhaze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7f3928" stop-opacity=".78"/><stop offset="1" stop-color="#f5bd71" stop-opacity="0"/></linearGradient>
 <linearGradient id="mesaFar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8e4936"/><stop offset="1" stop-color="#5b3128"/></linearGradient>
 <linearGradient id="mesaNear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a85a3c"/><stop offset="1" stop-color="#6b382a"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3b3"/><stop offset=".5" stop-color="#ffbd56"/><stop offset="1" stop-color="#d86b2e"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff0a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffb14b" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<!-- warm high-atmosphere veil -->
<rect width="1280" height="238" fill="url(#skyhaze)"/>
<circle cx="1080" cy="94" r="102" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="1080" cy="94" r="30" fill="url(#sun)" opacity=".74"/>
<!-- far mesas create horizon rhythm -->
<path d="M0 143 L62 108 L127 119 L181 78 L250 96 L304 62 L362 91 L423 74 L474 112 L533 92 L598 121 L657 87 L723 103 L790 72 L850 100 L909 83 L968 118 L1028 91 L1097 108 L1163 76 L1220 103 L1280 87 L1280 187 L0 187Z" fill="url(#mesaFar)" opacity=".67"/>
<path d="M0 166 L86 144 L142 153 L213 125 L278 149 L348 121 L421 151 L490 129 L562 159 L639 127 L707 153 L777 126 L842 158 L915 126 L985 153 L1056 124 L1126 150 L1196 128 L1280 150 L1280 204 L0 204Z" fill="url(#mesaNear)" opacity=".58"/>
