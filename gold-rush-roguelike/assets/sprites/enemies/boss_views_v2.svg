<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="384" viewBox="0 0 2048 384">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3a0"/><stop offset=".22" stop-color="#f3c43d"/><stop offset=".55" stop-color="#c78312"/><stop offset=".82" stop-color="#8a4e08"/><stop offset="1" stop-color="#4d2b05"/></linearGradient>
 <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c78419"/><stop offset="1" stop-color="#5c3307"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4b1b5"/><stop offset=".38" stop-color="#526269"/><stop offset=".72" stop-color="#2b383e"/><stop offset="1" stop-color="#141c20"/></linearGradient>
 <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4f5a5e"/><stop offset=".5" stop-color="#242d31"/><stop offset="1" stop-color="#101518"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#ffffff"/><stop offset=".16" stop-color="#baffff"/><stop offset=".38" stop-color="#55ebff"/><stop offset=".72" stop-color="#0b8fa8"/><stop offset="1" stop-color="#064756"/></radialGradient>
 <radialGradient id="hot"><stop stop-color="#fff9be"/><stop offset=".28" stop-color="#ffd650"/><stop offset=".58" stop-color="#ff7b24"/><stop offset="1" stop-color="#f0371c" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

 <g id="tankBase">
  <ellipse cx="256" cy="337" rx="188" ry="24" fill="#120e0a" opacity=".42"/>

  <!-- wide continuous tracks -->
  <path d="M72 247 Q77 218 110 207 H401 Q433 216 440 247 L430 316 Q425 339 394 346 H116 Q84 338 79 315Z" fill="url(#track)" stroke="#0b1013" stroke-width="12"/>
  <path d="M98 250 H415 L406 311 Q403 323 386 327 H121 Q104 323 101 310Z" fill="#1a2226" stroke="#59666b" stroke-width="6"/>
  <g fill="#344249" stroke="#11191d" stroke-width="6">
   <circle cx="128" cy="288" r="30"/><circle cx="190" cy="288" r="30"/><circle cx="256" cy="288" r="34"/><circle cx="322" cy="288" r="30"/><circle cx="384" cy="288" r="30"/>
  </g>
  <g fill="#879399" opacity=".62"><circle cx="128" cy="288" r="11"/><circle cx="190" cy="288" r="11"/><circle cx="256" cy="288" r="13"/><circle cx="322" cy="288" r="11"/><circle cx="384" cy="288" r="11"/></g>
  <path d="M93 236h329M95 323h323" stroke="#7a8588" stroke-width="7" stroke-dasharray="21 9" opacity=".65"/>

  <!-- lower armored hull -->
  <path d="M116 214 L147 143 L190 118 H326 L368 144 L398 214 L365 269 H149Z" fill="url(#goldDark)" stroke="#4b2c07" stroke-width="12"/>
  <path d="M148 194 L173 147 H340 L365 194 L348 225 H165Z" fill="url(#gold)" stroke="#704507" stroke-width="8"/>
  <path d="M176 219h160M191 244h131" stroke="#ffe88a" stroke-width="6" opacity=".42"/>

  <!-- side mining armor pods -->
  <path d="M104 165 L145 142 L169 164 L153 210 L108 218 L82 193Z" fill="url(#steel)" stroke="#172125" stroke-width="9"/>
  <path d="M407 165 L366 142 L343 164 L358 210 L403 218 L430 193Z" fill="url(#steel)" stroke="#172125" stroke-width="9"/>
  <g fill="url(#gold)" stroke="#633a06" stroke-width="5"><path d="M98 181l18-14 21 7 10 20-19 14-21-7z"/><path d="M414 181l-18-14-21 7-10 20 19 14 21-7z"/></g>

  <!-- angular turret -->
  <path d="M171 137 L194 79 L225 58 H305 L337 79 L359 137 L330 174 H190Z" fill="url(#steel)" stroke="#111b20" stroke-width="12"/>
  <path d="M205 92 L231 72 H298 L324 91 L333 129 L311 151 H216 L194 129Z" fill="#253239" stroke="#62737a" stroke-width="6"/>
  <circle cx="263" cy="119" r="35" fill="#15232a" stroke="#0c1519" stroke-width="8"/>
  <circle cx="263" cy="119" r="22" fill="url(#cyan)" stroke="#0b5667" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="111" r="6" fill="#fff" opacity=".94"/>

  <!-- heavy cannon + magnetic muzzle -->
  <path d="M320 89 L402 57 L414 76 L333 111Z" fill="url(#steel)" stroke="#111a1f" stroke-width="11"/>
  <path d="M392 51 L451 37 L463 73 L410 84Z" fill="#35464e" stroke="#10171a" stroke-width="9"/>
  <circle cx="458" cy="55" r="20" fill="#1e353e" stroke="#0d171b" stroke-width="8"/>
  <circle cx="458" cy="55" r="10" fill="url(#cyan)" opacity=".84"/>

  <!-- rivets / industrial detail -->
  <g fill="#f1bd3b" stroke="#62420b" stroke-width="3">
   <circle cx="161" cy="174" r="6"/><circle cx="350" cy="174" r="6"/><circle cx="177" cy="251" r="6"/><circle cx="334" cy="251" r="6"/>
   <circle cx="210" cy="142" r="5"/><circle cx="315" cy="142" r="5"/>
  </g>
  <path d="M153 143l-17-33 18-9 18 34M359 143l17-33-18-9-18 34" fill="none" stroke="#39474d" stroke-width="8"/>
 </g>
</defs>

<!-- IDLE: stable tracked mining tank -->
<g transform="translate(0 0)">
 <use href="#tankBase"/>
 <path d="M206 192 Q257 211 307 192" fill="none" stroke="#ffe98a" stroke-width="5" opacity=".45"/>
 <g fill="#61efff" opacity=".64" filter="url(#glow)"><circle cx="148" cy="231" r="5"/><circle cx="363" cy="231" r="5"/></g>
</g>

<!-- LASER PREP: muzzle coils and central reactor overcharge -->
<g transform="translate(512 0)">
 <use href="#tankBase"/>
 <circle cx="458" cy="55" r="54" fill="url(#hot)" filter="url(#glow)"/>
 <circle cx="458" cy="55" r="34" fill="none" stroke="#ffd85a" stroke-width="7"/>
 <circle cx="458" cy="55" r="46" fill="none" stroke="#ff6530" stroke-width="5" stroke-dasharray="17 10"/>
 <path d="M425 23l-15-18M462 16l5-21M489 29l19-13M494 63l24 7M431 88l-17 17" stroke="#ffd95d" stroke-width="6" stroke-linecap="round"/>
 <circle cx="263" cy="119" r="43" fill="#55ecff" opacity=".24" filter="url(#glow)"/>
 <path d="M170 228h184" stroke="#62edff" stroke-width="5" opacity=".42" filter="url(#glow)"/>
</g>

<!-- DAMAGED: cracked armor, exposed reactor, smoke -->
<g transform="translate(1024 0)">
 <use href="#tankBase"/>
 <path d="M163 153 L188 176 L177 203 L207 222 L192 252" fill="none" stroke="#3c2207" stroke-width="9"/>
 <path d="M344 150 L319 177 L330 204 L301 224 L316 251" fill="none" stroke="#422507" stroke-width="9"/>
 <path d="M117 255l31 10-18 24 32 12M388 247l-29 14 20 21-31 15" fill="none" stroke="#ff6934" stroke-width="7" filter="url(#glow)"/>
 <circle cx="263" cy="119" r="22" fill="#ff7549" stroke="#6e2d1c" stroke-width="6"/>
 <g fill="#323235" opacity=".66"><circle cx="183" cy="72" r="17"/><circle cx="162" cy="53" r="13"/><circle cx="145" cy="34" r="9"/><circle cx="370" cy="96" r="12"/></g>
 <path d="M232 82l-13-19M292 82l15-20" stroke="#ff8a40" stroke-width="5"/>
</g>

<!-- FIRING: chassis recoil + enormous muzzle plasma -->
<g transform="translate(1536 0)">
 <g transform="translate(-11 5) rotate(0.8 256 190)"><use href="#tankBase"/></g>
 <circle cx="451" cy="58" r="59" fill="url(#hot)" filter="url(#glow)"/>
 <path d="M448 43 L511 19 L511 94 L449 72Z" fill="#fff8b4" opacity=".94"/>
 <path d="M452 34 L510 3 M455 82 L510 112" stroke="#ff8e2b" stroke-width="12" stroke-linecap="round"/>
 <circle cx="252" cy="125" r="32" fill="#6df3ff" opacity=".22" filter="url(#glow)"/>
 <path d="M149 226h204" stroke="#79f6ff" stroke-width="6" opacity=".46" filter="url(#glow)"/>
</g>
</svg>