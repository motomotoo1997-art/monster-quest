<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a0"/><stop offset=".28" stop-color="#f4b52f"/><stop offset=".62" stop-color="#b86a16"/><stop offset="1" stop-color="#6c3612"/></linearGradient>
  <linearGradient id="darkGold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7e5425"/><stop offset="1" stop-color="#2e2118"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b979b"/><stop offset=".5" stop-color="#414a4d"/><stop offset="1" stop-color="#202629"/></linearGradient>
  <radialGradient id="cyan"><stop stop-color="#ffffff"/><stop offset=".18" stop-color="#bafaff"/><stop offset=".52" stop-color="#38ddeb"/><stop offset="1" stop-color="#08798b"/></radialGradient>
  <radialGradient id="amber"><stop stop-color="#fffbd1"/><stop offset=".28" stop-color="#ffd55d"/><stop offset="1" stop-color="#cc6b15"/></radialGradient>
  <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="goldGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- grounded shadow -->
<ellipse cx="256" cy="447" rx="146" ry="31" fill="#1a1009" opacity=".34"/>
<ellipse cx="256" cy="438" rx="102" ry="20" fill="#ffbb38" opacity=".16" filter="url(#goldGlow)"/>

