name: Gold Rush Godot CI

on:
  push:
    branches:
      - feature/gold-rush-vertical-slice
    paths:
      - 'gold-rush-roguelike/**'
      - '.github/workflows/gold-rush-godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project headlessly
        run: timeout 45s godot --headless --path gold-rush-roguelike --editor --quit

      - name: Health and teams
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_health_and_teams.gd

      - name: Weapon and projectile
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_weapon_and_projectile.gd

      - name: Economy and building
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_economy_and_building.gd

      - name: Roguelike upgrades
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_upgrades.gd

      - name: Run flow and boss state
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_run_flow.gd

      - name: Main scene smoke test
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/smoke_main_scene.gd
