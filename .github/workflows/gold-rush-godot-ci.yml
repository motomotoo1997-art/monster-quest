name: Gold Rush Godot CI

on:
  push:
    branches:
      - feature/gold-rush-vertical-slice
    paths:
      - 'gold-rush-roguelike/**'
      - '.github/workflows/gold-rush-godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project headlessly
        run: timeout 45s godot --headless --path gold-rush-roguelike --editor --quit

      - name: Health and teams
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_health_and_teams.gd

      - name: Weapon and projectile
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_weapon_and_projectile.gd

      - name: Economy and building
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_economy_and_building.gd

      - name: Enemy gold drops
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_enemy_gold_drops.gd

      - name: Roguelike upgrades
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_upgrades.gd

      - name: Run flow and boss state
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_run_flow.gd

      - name: Arena multiwave pacing
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_arena_multiwave_pacing.gd

      - name: Wave lifecycle regression
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_wave_lifecycle.gd

      - name: Gold Bar Tank laser regression
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_boss_laser.gd

      - name: Gold Bar Tank presentation regression
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/test_boss_presentation.gd

      - name: Main scene smoke test
        run: timeout 45s godot --headless --path gold-rush-roguelike --script res://tests/smoke_main_scene.gd

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Export Windows x86_64 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gold-rush-roguelike/build
          timeout 90s godot --headless --path gold-rush-roguelike --export-release "Windows Desktop" build/GoldRushRoguelike.exe
          test -s gold-rush-roguelike/build/GoldRushRoguelike.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GoldRushRoguelike-Windows-x86_64
          path: gold-rush-roguelike/build/GoldRushRoguelike.exe
          if-no-files-found: error
          retention-days: 14
