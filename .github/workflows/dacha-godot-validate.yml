name: Dacha Godot Validate

on:
  push:
    branches: [dacha-last-day-prototype]
    paths:
      - 'dacha-last-day/**'
      - '.github/workflows/dacha-godot-validate.yml'
  pull_request:
    paths:
      - 'dacha-last-day/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path dacha-last-day --quit
      - name: Smoke test
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path dacha-last-day --script res://tests/smoke_test.gd
