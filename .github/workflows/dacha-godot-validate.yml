name: Dacha Godot Validate

on:
  push:
    branches: [dacha-last-day-prototype]
    paths:
      - 'dacha-last-day/**'
      - '.github/workflows/dacha-godot-validate.yml'
  pull_request:
    paths:
      - 'dacha-last-day/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: timeout 45s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path dacha-last-day --quit
      - name: Smoke test
        run: timeout 45s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path dacha-last-day --script res://tests/smoke_test.gd
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Render visual preview
        run: timeout 60s xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path dacha-last-day --script res://tests/screenshot_test.gd
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: dacha-prototype-visual-preview
          path: dacha-last-day/artifacts/ci_preview.png
          if-no-files-found: error
      - name: Package source project
        run: zip -qr dacha-last-day-source.zip dacha-last-day -x 'dacha-last-day/.godot/*' 'dacha-last-day/artifacts/*'
      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: dacha-last-day-source
          path: dacha-last-day-source.zip
